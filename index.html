<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Expense Recorder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Monthly Expense Recorder</h1>

        <div class="expense-form">
            <label for="expense-amount">Amount:</label>
            <input type="number" id="expense-amount" placeholder="e.g., 50.00" min="0" step="0.01" required>

            <label for="expense-category">Category:</label>
            <input type="text" id="expense-category" placeholder="e.g., Groceries, Rent" required>

            <button id="add-expense-btn">Add Expense</button>
        </div>

        <h2>Your Expenses</h2>
        <div id="expense-list" class="expense-list">
            <!-- Expenses will be loaded here -->
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
